<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linkome</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{--bg:#141414;--surface:#1C1C1C;--surface2:#232323;--line:#2C2C2C;--lime:#CCFF00;--yellow:#FFFF00;--ink:#000;--text:#fff;--muted:#9AA0A6;--muted2:#6F757B}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  button{font:inherit;cursor:pointer}
  input,textarea,select{font:inherit}
  input:focus-visible,button:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}

  .wm{font-weight:800;letter-spacing:-0.03em;color:var(--lime);line-height:1}
  .wm b{color:var(--yellow);font-weight:800}
  .wm.dark{color:var(--ink)} .wm.dark b{color:var(--ink)}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:13px 26px;font-weight:700;font-size:15px}
  .btn.y{background:var(--yellow);color:var(--ink)}
  .btn.k{background:var(--ink);color:var(--lime)}
  .btn.g{background:transparent;color:var(--lime);border:1.5px solid var(--lime)}
  .btn.sm{padding:8px 16px;font-size:13.5px}
  .btn.xs{padding:6px 12px;font-size:12.5px}
  .btn:hover{filter:brightness(.96)}
  .btn:disabled{opacity:.4;cursor:not-allowed}

  /* centered pages */
  .center{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:72px 24px 60px}
  .center .wm{font-size:58px}
  .lm{display:block;line-height:0}
  .lm video{width:330px;max-width:86vw;height:auto;display:block}
  .sub{margin:16px 0 34px;text-align:center;font-weight:600;font-size:16px}
  .sub .l{display:block}
  .inputbar{width:100%;max-width:640px;background:#fff;border-radius:999px;display:flex;align-items:center;padding:6px 6px 6px 22px;gap:8px}
  .inputbar input{flex:1;border:0;background:transparent;color:var(--ink);font-size:15px;min-width:0}
  .inputbar input::placeholder{color:#8A8F94}
  .inputbar .btn{padding:11px 22px}
  .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:22px;width:100%;max-width:640px;margin-top:54px}
  .card{border-radius:18px;padding:24px 22px;color:var(--ink);min-height:150px}
  .card.y{background:var(--yellow)} .card.l{background:var(--lime)}
  .card b{display:block;font-size:15.5px;margin-bottom:6px}
  .card p{margin:0;font-size:14px;line-height:1.5}
  .created .wm{font-size:52px}
  .created .done{margin:14px 0 40px;font-weight:600;font-size:16px}

  /* table */
  .tbl{width:100%;max-width:760px;border-collapse:collapse;font-size:14.5px}
  .tbl th{color:var(--yellow);font-weight:700;text-align:left;padding:8px 10px;white-space:nowrap}
  .tbl td{padding:10px 10px;color:var(--lime);vertical-align:middle;border-top:1px solid var(--line)}
  .tbl td.u{color:var(--text)}
  .tbl td.trunc{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tbl tr.new td{background:#1A1F00}
  .tbl .ic{display:inline-flex;gap:10px}
  .ib{background:transparent;border:0;color:var(--lime);padding:4px;border-radius:6px;display:inline-flex}
  .ib:hover{background:var(--surface2)}
  .dots{color:var(--muted);letter-spacing:6px;margin:28px 0 36px;text-align:center}
  .empty{color:var(--muted);padding:26px 0;text-align:center}
  .pager{display:flex;gap:6px;align-items:center;justify-content:center;margin:26px 0 8px;max-width:760px}
  .pager a,.pager span{min-width:34px;height:34px;padding:0 10px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--muted)}
  .pager a:hover{background:var(--surface2);color:var(--text)}
  .pager a.on{background:var(--yellow);color:var(--ink)}
  .pager span.dis{opacity:.35}

  /* shell */
  .shell{display:grid;grid-template-columns:184px 1fr;min-height:100%}
  .side{background:var(--lime);color:var(--ink);padding:26px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
  .side .logo{display:flex;align-items:center;gap:8px;margin:0 6px 26px}
  .side .logo .wm{font-size:20px}
  .side nav a{display:block;padding:11px 14px;border-radius:999px;font-weight:700;font-size:15.5px;color:var(--ink)}
  .side nav a:hover{background:rgba(0,0,0,.08)}
  .side nav a.on{background:var(--ink);color:var(--lime)}
  .side .foot{margin-top:auto;font-size:12px;color:rgba(0,0,0,.6);padding:0 6px}
  .main{padding:40px 44px 60px;min-width:0}
  .head{display:flex;align-items:center;gap:20px;margin-bottom:30px}
  .avatar{width:72px;height:72px;border-radius:50%;background:#D9D9D9;flex:none}
  .head h1{margin:0;font-size:19px;font-weight:700}
  .head p{margin:4px 0 0;color:var(--muted);font-size:13.5px}
  h2.sec{font-size:15px;font-weight:700;margin:32px 0 12px}

  /* home hero */
  .hero{display:flex;flex-direction:column;align-items:center;padding:28px 0 8px}
  .hero .wm{font-size:50px}
  .lockup{display:flex;align-items:center;gap:14px}
  .lockup svg{width:66px;height:66px;flex:none}
  .hero .sub{margin:14px 0 26px}
  .recent{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .rc{background:var(--surface);border-radius:14px;padding:16px}
  .rc b{display:block;font-size:15px;margin-bottom:4px}
  .rc .url{color:var(--lime);font-size:13px;word-break:break-all}
  .rc .row{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
  .rc .type{font-size:12px;color:var(--muted)}
  .today{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .tt{background:var(--surface);border-radius:14px;padding:16px}
  .tt small{display:block;color:var(--muted);font-size:12.5px}
  .tt strong{display:block;font-size:24px;font-weight:800;color:var(--lime);margin-top:4px}

  /* public profile (follower view) + owner edit view */
  .pub{min-height:100vh;background:var(--lime);color:var(--ink);padding:24px 18px 56px;display:flex;flex-direction:column;align-items:center}
  .pub.embed{min-height:0;border-radius:22px;padding:22px 18px 40px}
  .pub .top{width:100%;max-width:520px;display:flex;justify-content:space-between;margin-bottom:6px}
  .pub .cic{width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.12);display:inline-flex;align-items:center;justify-content:center;color:var(--ink);border:0}
  .pub .cic:hover{background:rgba(0,0,0,.2)}
  .pub .pav{width:112px;height:112px;border-radius:50%;background:#D9D9D9;margin-top:-8px;overflow:hidden}
  .pub .pav img{width:100%;height:100%;object-fit:cover;display:block}
  .namerow{display:flex;align-items:center;gap:10px;margin:16px 0 4px}
  .pub .pname{font-size:26px;font-weight:800;letter-spacing:-0.01em}
  a.pen{text-decoration:none}
  .editbtn{border:0;background:rgba(0,0,0,.12);color:var(--ink);border-radius:999px;padding:9px 16px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px}
  .editbtn:hover{background:rgba(0,0,0,.22)}
  .editbtn.on{background:var(--ink);color:var(--lime)}
  .pen{border:0;background:rgba(0,0,0,.12);color:var(--ink);width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center}
  .pen:hover{background:rgba(0,0,0,.22)}
  .pen.on{background:var(--ink);color:var(--lime)}
  .pub .pbio{font-size:14px;color:rgba(0,0,0,.65);margin:0 0 22px;text-align:center;max-width:420px}
  .phandle{font-size:14px;color:rgba(0,0,0,.65);display:flex;align-items:center;gap:8px;margin:2px 0 8px}
  .minicopy{border:0;background:rgba(0,0,0,.12);color:#000;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:4px}
  .minicopy:hover{background:rgba(0,0,0,.22)}
  .minicopy svg{width:13px;height:13px}
  .infoedit{width:100%;max-width:520px;background:rgba(255,255,255,.7);border-radius:16px;padding:14px;margin:6px 0 20px;display:grid;gap:10px}
  .infoedit label{display:block;font-size:12px;color:#4a4f55;margin-bottom:4px;font-weight:600}
  .infoedit input,.infoedit textarea{width:100%;border:0;border-radius:10px;padding:10px 12px;background:#fff;color:var(--ink)}
  .infoedit textarea{min-height:60px;resize:vertical}
  .infoedit .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
  .blocks{width:100%;max-width:520px;display:grid;gap:14px}
  .blk{background:#fff;border-radius:18px;padding:14px;display:grid;grid-template-columns:76px 1fr 76px;align-items:center;gap:12px;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
  a.blk:hover{transform:translateY(-1px)}
  .th{border-radius:12px;background:#F1F1F1;display:flex;align-items:center;justify-content:center;font-size:12px;color:#6F757B;font-weight:700;letter-spacing:.02em;overflow:hidden}
  .th img{width:100%;height:100%;object-fit:cover;display:block}
  .blk .th{width:76px;height:76px}
  .blk .bt{text-align:center;font-weight:600;font-size:16px;line-height:1.4;word-break:keep-all}
  .pub .pfoot{margin-top:34px;font-size:12px;color:rgba(0,0,0,.55)}
  .pub .pfoot b{color:#000;font-weight:800}
  .pub .empty{color:rgba(0,0,0,.55)}
  /* edit-mode block */
  .eblk{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:center}
  .eblk[draggable]{cursor:grab}
  .eblk.over .blk{outline:2px dashed #000;outline-offset:3px}
  .eblk .blk{grid-template-columns:76px 1fr 44px}
  .eblk.hid .blk{opacity:.5}
  .eblk.hid .bt{text-decoration:line-through;text-decoration-color:#8A8F94}
  .handle{display:flex;flex-direction:column;gap:3px;align-items:center}
  .handle i{display:block;width:18px;height:2px;background:#000;border-radius:2px}
  .thbtn{border:0;padding:0;cursor:pointer;position:relative}
  .thbtn::after{content:"이미지";position:absolute;inset:auto 0 0 0;background:rgba(0,0,0,.55);color:#fff;font-size:10px;padding:2px 0;text-align:center}
  .eyetog{border:0;background:transparent;padding:6px;border-radius:8px;display:inline-flex;cursor:pointer;justify-self:end}
  .eyetog.on{color:#000}
  .eyetog.off{color:#9AA0A6}
  .eyetog:hover{background:#f0f0f0}
  .addbtn{width:100%;max-width:520px;margin-top:14px;border:2px dashed rgba(0,0,0,.45);background:transparent;color:var(--ink);border-radius:18px;padding:16px;font-weight:700;font-size:15px}
  .addbtn:hover{background:rgba(255,255,255,.35)}
  .pubwrap{max-width:560px}
  .prev{width:100%;max-width:520px;background:rgba(0,0,0,.82);color:var(--yellow);border-radius:12px;padding:8px 14px;font-size:12.5px;margin-bottom:10px;display:flex;justify-content:space-between;gap:10px;align-items:center}
  .prev a{color:#fff;text-decoration:underline;white-space:nowrap}
  .updatebar{position:sticky;bottom:0;max-width:560px;margin-top:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(20,20,20,.92);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .updatebar.dirty{border-color:var(--yellow)}
  .updatebar .ustat{font-size:13px;color:var(--muted)}
  .updatebar.dirty .ustat{color:var(--yellow)}
  .updatebar .uact{display:flex;gap:8px}

  /* report */
  .period{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:-8px 0 18px}
  .period .seg{display:inline-flex;background:var(--surface);border-radius:999px;padding:4px}
  .period .seg button{border:0;background:transparent;color:var(--muted);padding:7px 14px;border-radius:999px;font-weight:600;font-size:13.5px}
  .period .seg button.on{background:var(--yellow);color:var(--ink)}
  .period .custom{display:inline-flex;gap:6px;align-items:center;background:var(--surface);border-radius:999px;padding:4px 6px 4px 12px;font-size:13px;color:var(--muted)}
  .period input[type=date]{border:0;background:#fff;color:var(--ink);border-radius:999px;padding:6px 10px;font-size:13px}
  .period .range{font-size:13px;color:var(--muted);margin-left:auto}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .kpi{background:var(--surface);border-radius:14px;padding:14px 16px 10px}
  .kpi small{display:block;color:var(--muted);font-size:12px}
  .kpi strong{display:block;font-size:24px;font-weight:800;color:var(--lime);margin-top:6px;letter-spacing:-0.01em}
  .kpi .d{font-size:12px;color:var(--yellow);margin-top:2px}
  .kpi .d span{color:var(--muted)}
  .kpi svg{display:block;width:100%;height:36px;margin-top:8px}
  .live{margin-top:12px;background:var(--surface);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--muted);display:flex;gap:18px;flex-wrap:wrap}
  .live b{color:var(--lime)}
  .settle{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
  .settle .big{font-size:30px;font-weight:800;color:var(--lime)}
  .settle .est{font-size:12px;color:var(--yellow);background:rgba(255,255,0,.12);padding:3px 10px;border-radius:999px}
  .sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .srow{display:flex;flex-direction:column;gap:3px;background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted)}
  .srow b{color:var(--text);font-weight:700;font-size:15px}
  .snote{font-size:12.5px;color:var(--muted);line-height:1.55;margin-top:12px} .snote b{color:var(--yellow)}
  .panels{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-top:12px}
  .panel{background:var(--surface);border-radius:14px;padding:16px}
  .panel h3{margin:0 0 10px;font-size:14px;font-weight:700}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:6px;flex-wrap:wrap}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
  .panel svg{width:100%;display:block}
  .donutwrap{display:flex;align-items:center;gap:16px}
  .donutwrap svg{width:130px;height:130px;flex:none}
  .dl{display:grid;gap:8px;font-size:13px}
  .dl div{display:flex;justify-content:space-between;gap:12px}
  .dl b{color:var(--text);font-weight:600}
  .top5{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}
  .top5 th{text-align:left;color:var(--muted);font-weight:600;font-size:12.5px;padding:8px 10px;border-bottom:1px solid #3a3a3a}
  .top5 td{padding:10px;border-bottom:1px solid var(--line)}
  .top5 td:first-child{color:var(--lime);font-weight:700}
  .top5 .bar{display:inline-block;height:8px;background:var(--lime);border-radius:4px;vertical-align:middle;margin-right:8px}
  .more{margin-top:26px;display:flex;justify-content:center}

  /* viewer */
  .viewer{max-width:560px;width:100%;background:var(--surface);border-radius:20px;padding:34px 30px;margin-top:20px}
  .viewer .wm{font-size:26px}
  .viewer h1{font-size:22px;margin:22px 0 6px}
  .viewer .type{color:var(--muted);font-size:13.5px}
  .placeholder{margin:22px 0;padding:18px;border:1.5px dashed var(--yellow);border-radius:14px;color:var(--yellow);font-size:14px;line-height:1.55}
  .viewer .cnt{color:var(--muted);font-size:12.5px;margin-top:16px}
  .actions{display:flex;gap:12px;flex-wrap:wrap}

  /* toast / modals */
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--lime);color:var(--ink);padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .18s;z-index:60}
  .toast.show{opacity:1}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
  .modal.show{display:flex}
  .modal .box{background:var(--surface);border-radius:18px;padding:26px;max-width:380px;width:100%;text-align:center}
  .modal h3{margin:0 0 8px;font-size:17px}
  .modal p{margin:0 0 20px;color:var(--muted);font-size:14px}
  /* picker */
  .pick .box{max-width:520px;text-align:left;max-height:86vh;display:flex;flex-direction:column}
  .pick h3{margin-bottom:4px}
  .pick .list{overflow:auto;margin:12px -6px;padding:0 6px;display:grid;gap:8px;max-height:44vh}
  .pick .item{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--surface2);border-radius:12px;padding:10px 12px;cursor:pointer;border:2px solid transparent;color:var(--text)}
  .pick .item:hover{border-color:#3a3a3a}
  .pick .item.sel{border-color:var(--lime)}
  .pick .item .th{width:44px;height:44px;border-radius:8px;font-size:11px;background:#2E2E2E;color:#9AA0A6}
  .pick .item b{display:block;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pick .item small{color:var(--muted);font-size:12px}
  .pick .item .chk{width:22px;height:22px;border-radius:50%;border:2px solid #4a4a4a;display:inline-flex;align-items:center;justify-content:center;color:var(--ink);font-size:13px;font-weight:800}
  .pick .item.sel .chk{background:var(--lime);border-color:var(--lime)}
  .imgrow{display:flex;align-items:center;gap:12px;background:var(--surface2);border-radius:12px;padding:10px 12px;margin-top:4px}
  .imgrow .th{width:56px;height:56px;border-radius:10px;background:#2E2E2E;color:#9AA0A6;font-size:11px;flex:none}
  .imgrow .lbl{flex:1;font-size:13px;color:var(--muted)}
  .imgrow input[type=file]{display:none}
  .pick .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
  .proto{position:fixed;right:14px;bottom:14px;font-size:11.5px;color:var(--muted2);background:rgba(0,0,0,.5);padding:5px 10px;border-radius:999px;z-index:30}

  @media (max-width:860px){
    .shell{grid-template-columns:1fr}
    .side{position:static;height:auto;flex-direction:row;align-items:center;flex-wrap:wrap;padding:14px 16px}
    .side .logo{margin:0 14px 0 0}
    .side nav{display:flex;gap:4px;flex-wrap:wrap}
    .side nav a{padding:8px 12px;font-size:14px}
    .side .foot{display:none}
    .main{padding:26px 18px 50px}
    .kpis,.recent,.today{grid-template-columns:repeat(2,1fr)}
    .panels{grid-template-columns:1fr}
    .cards{grid-template-columns:1fr}
    .center .wm{font-size:44px}
    .blk{grid-template-columns:64px 1fr 64px}
    .blk .th{width:64px;height:64px}
    .period .range{margin-left:0;width:100%}
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="box"><h3 id="mTitle">준비 중</h3><p id="mBody"></p><button class="btn y sm" id="mClose">확인</button></div></div>
<div class="modal" id="editModal"><div class="box" style="text-align:left"><h3 style="margin:0 0 14px">링크 편집</h3>
  <div class="f" style="margin-bottom:12px"><label style="display:block;font-size:12px;color:var(--muted);margin-bottom:6px">제목</label><input id="edTitle" style="width:100%;background:#fff;color:#000;border:0;border-radius:10px;padding:11px 13px"></div>
  <div class="f" style="margin-bottom:6px"><label style="display:block;font-size:12px;color:var(--muted);margin-bottom:6px">타입</label>
    <select id="edType" style="width:100%;background:#fff;color:#000;border:0;border-radius:10px;padding:11px 13px"><option>스프레드시트</option><option>노션</option><option>문서</option></select>
    <div style="font-size:12px;color:var(--muted2);margin-top:6px">URL로 자동 추정된 값이에요. 틀리면 바꿔주세요.</div></div>
  <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px"><button class="btn g sm" id="edCancel">취소</button><button class="btn y sm" id="edSave">저장</button></div>
</div></div>
<div class="modal pick" id="pick"><div class="box">

  const totalRevenue=7850000*f;

const LOGO_MOTION=()=>`<div class="lm" id="lm"><video id="lmv" autoplay muted playsinline preload="auto" aria-label="Linkome"><source src="${LOGO_MP4}" type="video/mp4"><source src="${LOGO_WEBM}" type="video/webm"></video></div>`;
const WM=(cls='')=>`<div class="wm ${cls}">Link<b>o</b>me</div>`;
const INPUTBAR=(id,iid)=>`<form class="inputbar" id="${id}"><input id="${iid}" placeholder="수익화할 링크(URL)를 붙여넣으세요" autocomplete="off"><button class="btn k" type="submit">만들기</button></form>`;
function thumb(b,l){return b&&b.image?`<img src="${b.image}" alt="">`:esc(typeLabel(l.type))}

/* ================= pages ================= */
function pageLanding(){
  return `<div class="center">
    ${LOGO_MOTION()}
    <div class="sub"><span class="l">수익달성 조건 없이</span><span class="l">단 1초만에 내 링크에 수익을 만들어보세요</span></div>
    ${INPUTBAR('mk','url')}
    <div class="cards">
      <div class="card y"><b>링크로 광고 수익 벌기</b><p>스프레드시트/노션 템플릿 링크에 수익을 만들 수 있어요.</p></div>
      <div class="card y"><b>수익달성 조건없이 시작</b><p>구독자 1,000명까지 기다릴 필요 없어요. 지금 바로 링크 수익화에 도전하세요.</p></div>
      <div class="card l"><b>링크 성과 관리</b><p>분산돼있는 내 링크의 조회수와 수익을 한 번에 확인하세요!</p></div>
      <div class="card l"><b>내 링크 관리</b><p>팔로워들에게 보여줄 링크 목록도 내 링크 프로필로 관리할 수 있어요.</p></div>
    </div>
  </div>`;
}
function linkTable(list,newSlug,startNo){
  const rows=list.map((l,i)=>`<tr class="${l.slug===newSlug?'new':''}">
    <td>${startNo+i}</td><td>${esc(l.title)}</td><td>${esc(l.type)}</td>
    <td class="u trunc" title="${esc(l.original_url)}">${esc(l.original_url.replace(/^https?:\/\//,''))}</td>
    <td><a href="#/r/${l.slug}" target="_blank">${shortUrl(l)}</a></td>
    <td><span class="ic"><button class="ib" data-edit="${l.slug}" title="제목·타입 편집">${I.pen}</button><button class="ib" data-copy="${l.slug}" title="복사">${I.copy}</button><button class="ib" data-share="${l.slug}" title="공유">${I.send}</button></span></td></tr>`).join('');
  return `<table class="tbl"><thead><tr><th>No</th><th>Title</th><th>Type</th><th>URL</th><th>Linkome URL</th><th>Share</th></tr></thead><tbody>${rows||'<tr><td colspan="6" class="empty">아직 만든 링크가 없어요</td></tr>'}</tbody></table>`;
}
function pageCreated(newSlug){
  const l=linkBy(newSlug);
  return `<div class="center created">
    ${WM()}
    <div class="done">수익 링크를 만들었어요!</div>
    ${linkTable(l?[l]:S.links.slice(0,1),newSlug,1)}
    <div class="dots">· · · ·</div>
    <a class="btn y" href="#/links${newSlug?'?new='+newSlug:''}">&gt;&gt; 내 링크 관리하기</a>
  </div>`;
}
function shell(active,inner){
  const nav=[['home','Home'],['profile','Profile'],['links','Link'],['report','Report']].map(([r,n])=>`<a href="#/${r}" class="${active===r?'on':''}">${n}</a>`).join('');
  return `<div class="shell"><aside class="side"><div class="logo">${ICON_LINK}${WM('dark')}</div><nav>${nav}</nav><div class="foot">${(USE_DB&&CURRENT_UID)?`<div style="margin-bottom:6px;word-break:break-all">${CURRENT_EMAIL||''}</div><button id="logoutBtn" style="border:0;background:rgba(0,0,0,.12);color:var(--ink);border-radius:8px;padding:6px 10px;font-weight:700;font-size:12px;cursor:pointer">로그아웃</button>`:'Linkome'}</div></aside><main class="main">${inner}</main></div>`;
}
function head(title,sub){return `<div class="head"><div class="avatar">${S.profile.avatar?`<img src="${S.profile.avatar}" style="width:100%;height:100%;border-radius:50%;object-fit:cover">`:''}</div><div><h1>${title}</h1>${sub?`<p>${sub}</p>`:''}</div></div>`}

/* --- Home: onboarding hero + recent + today --- */
function pageHome(){
  const recent=S.links.slice(0,3).map(l=>`<div class="rc"><b>${esc(l.title)}</b><div class="url">${shortUrl(l)}</div><div class="row"><span class="type">${esc(l.type)}</span><button class="btn g sm" data-copy="${l.slug}">복사</button></div></div>`).join('');
  return shell('home',`
    <div class="hero"><div class="lockup">${ICON_NEON}${WM()}</div><div class="sub"><span class="l">수익달성 조건 없이</span><span class="l">단 1초만에 내 링크에 수익을 만들어보세요</span></div>${INPUTBAR('mk2','url2')}</div>
    <h2 class="sec">최근 만든 링크</h2>
    <div class="recent">${recent||'<div class="empty">아직 없어요</div>'}</div>
    <h2 class="sec">오늘 요약</h2>
    <div class="today"><div class="tt"><small>오늘 조회수</small><strong>1,284</strong></div><div class="tt"><small>오늘 방문자수</small><strong>862</strong></div><div class="tt"><small>오늘 광고 수익</small><strong>₩214,000</strong></div></div>
  `);
}

/* --- Link: archive with create bar + paginated table --- */
const PAGE=8;
function pageLinks(page,newSlug){
  const total=S.links.length, pages=Math.max(1,Math.ceil(total/PAGE));
  page=Math.min(Math.max(1,page||1),pages);
  const list=S.links.slice((page-1)*PAGE,page*PAGE);
  let pg='';
  pg+=page>1?`<a href="#/links?p=${page-1}">‹</a>`:`<span class="dis">‹</span>`;
  for(let i=1;i<=pages;i++)pg+=`<a href="#/links?p=${i}" class="${i===page?'on':''}">${i}</a>`;
  pg+=page<pages?`<a href="#/links?p=${page+1}">›</a>`:`<span class="dis">›</span>`;
  return shell('links',`
    ${head(esc(S.profile.name)+'님의 Link','만든 링크가 전부 여기에 쌓여요 · 총 '+total+'개')}
    <div style="max-width:760px;margin-bottom:26px">${INPUTBAR('mk3','url3')}</div>
    ${linkTable(list,newSlug,(page-1)*PAGE+1)}
    <div class="pager">${pg}</div>
  `);
}

/* --- Profile: follower view, inline edit, reorder/on-off, add-from-archive --- */
function blocksView(owner,useDraft){
  const ed=owner&&S.editing;
  const src=useDraft?D.blocks:S.blocks;
  const arr=ed?src:src.filter(b=>b.visible);
  if(!arr.length)return `<div class="empty">아직 프로필에 올린 링크가 없어요</div>`;
  return arr.map((b,i)=>{const l=linkBy(b.slug);if(!l)return'';
    if(!ed)return `<a class="blk" href="#/r/${l.slug}"><div class="th">${thumb(b,l)}</div><div class="bt">${esc(l.title)}</div><div></div></a>`;
    return `<div class="eblk ${b.visible?'':'hid'}" draggable="true" data-i="${i}">
      <div class="handle" title="드래그해서 순서 변경"><i></i><i></i><i></i></div>
      <div class="blk"><button class="th thbtn" data-img="${i}" title="썸네일 이미지 변경">${thumb(b,l)}</button><div class="bt">${esc(l.title)}</div>
      <button class="eyetog ${b.visible?'on':'off'}" data-toggle="${i}" title="${b.visible?'공개 중 — 클릭하면 숨김':'숨김 — 클릭하면 공개'}">${b.visible?I.eye:I.eyeoff}</button></div>
    </div>`;
  }).join('');
}
function profileView(owner,preview){
  const useDraft=owner||preview;
  const p=useDraft?D.profile:S.profile, ed=owner&&S.editing;
  return `<div class="pub${owner?' embed':''}">
    ${preview?`<div class="prev">미리보기 · 편집 중인 내용이에요 (아직 공개 반영 전) <a href="#/profile">편집으로 돌아가기</a></div>`:''}
    <div class="top"><button class="cic" data-pubshare title="공유">${I.share}</button>${owner?`<button class="editbtn ${ed?'on':''}" id="penBtn">${ed?'편집 완료':'편집하기'}</button>`:`<button class="cic" data-pubbell title="알림">${I.bell}</button>`}</div>
    ${owner?`<button class="pav thbtn" id="avBtn" title="프로필 사진 변경" style="border-radius:50%">${p.avatar?`<img src="${p.avatar}" alt="">`:''}</button>`:`<div class="pav">${p.avatar?`<img src="${p.avatar}" alt="">`:''}</div>`}
    <div class="namerow"><div class="pname">${esc(p.name)}</div>${owner?`<a class="pen" href="#/@${esc(p.handle)}?preview=1" target="_blank" title="편집 중인 화면 미리보기">${I.eye}</a>`:''}</div>

/* --- charts --- */
function spark(vals,color){const w=120,h=36,mx=Math.max(...vals),mn=Math.min(...vals);const pts=vals.map((v,i)=>`${(i/(vals.length-1)*w).toFixed(1)},${(h-4-((v-mn)/((mx-mn)||1))*(h-8)).toFixed(1)}`).join(' ');return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2"/></svg>`}
function lineChart(series,labels){const w=560,h=210,pl=36,pr=10,pt=12,pb=26;const iw=w-pl-pr,ih=h-pt-pb;let g='';for(let i=0;i<=4;i++){const y=pt+ih*i/4;g+=`<line x1="${pl}" x2="${w-pr}" y1="${y}" y2="${y}" stroke="#2C2C2C"/>`}
  const lines=series.map(s=>{const mx=Math.max(...s.v);const pts=s.v.map((v,i)=>`${(pl+iw*i/(s.v.length-1)).toFixed(1)},${(pt+ih-(v/mx)*ih).toFixed(1)}`).join(' ');return `<polyline points="${pts}" fill="none" stroke="${s.c}" stroke-width="2.2"/>`}).join('');
  const xl=labels.map((t,i)=>`<text x="${(pl+iw*i/(labels.length-1)).toFixed(1)}" y="${h-8}" fill="#9AA0A6" font-size="11" text-anchor="middle">${t}</text>`).join('');return `<svg viewBox="0 0 ${w} ${h}">${g}${lines}${xl}</svg>`}
function donut(parts){const r=44,c=2*Math.PI*r;let off=0;const segs=parts.map(p=>{const len=c*p.v/100;const s=`<circle cx="60" cy="60" r="${r}" fill="none" stroke="${p.c}" stroke-width="18" stroke-dasharray="${len} ${c-len}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`;off+=len;return s}).join('');return `<svg viewBox="0 0 120 120">${segs}</svg>`}

function render(){
  const raw=(location.hash||'#/').slice(1);const [path,qs]=raw.split('?');const q=new URLSearchParams(qs||'');
  const app=document.getElementById('app');let html='';
  const NEED_AUTH=['/home','/profile','/links','/report'];
  if(path==='/login'){html=pageAuth();}
  else if(USE_DB && !CURRENT_UID && NEED_AUTH.includes(path)){html=pageAuth();}
  else if(path==='/'||path==='')html=pageLanding();
  else if(path==='/created')html=pageCreated(q.get('new'));
  else if(path==='/home')html=pageHome();
  else if(path==='/profile')html=pageProfile();
  else if(path==='/links')html=pageLinks(+q.get('p')||1,q.get('new'));
  else if(path==='/report')html=pageReport();
  else if(path.startsWith('/r/'))html=pageViewer(path.slice(3));
  else if(path.startsWith('/@'))html=pagePublic(q.get('preview')==='1');
  else html=pageLanding();
  app.innerHTML=html;if(!render._keep)window.scrollTo(0,0);render._keep=false;bind(path);
}
function rerender(){render._keep=true;render()}
function bindCreate(formId,inputId,after){const f=document.getElementById(formId);if(!f)return;f.addEventListener('submit',e=>{e.preventDefault();const v=document.getElementById(inputId).value;const l=createLink(v);if(!l){toast('링크(URL)를 입력해주세요');return}after(l)})}

function bind(path){
  const lmv=document.getElementById('lmv');
  if(lmv){const fb=()=>{const w=document.getElementById('lm');if(w)w.innerHTML=WM()};lmv.onerror=fb;const pr=lmv.play();if(pr&&pr.catch)pr.catch(fb)}
  if(USE_DB&&!CURRENT_UID){const f=document.getElementById('mk');if(f)f.addEventListener('submit',e=>{e.preventDefault();location.hash='#/login'})}else bindCreate('mk','url',l=>location.hash='#/created?new='+l.slug);
  bindCreate('mk2','url2',l=>location.hash='#/links?new='+l.slug);
  bindCreate('mk3','url3',l=>{if(location.hash==='#/links?new='+l.slug)rerender();else location.hash='#/links?new='+l.slug});
  const at=document.getElementById('authToggle');if(at)at.onclick=()=>{authMode=authMode==='signup'?'signin':'signup';rerender()};
  const asub=document.getElementById('authSubmit');
  if(asub)asub.onclick=async()=>{
    const email=document.getElementById('authEmail').value.trim();const pw=document.getElementById('authPw').value;

    asub.disabled=true;
    try{
      if(authMode==='signup'){
        const {error}=await authSignUp(email,pw);
        if(error){msg.textContent='회원가입 실패: '+error.message}
        else{msg.style.color='#CCFF00';msg.textContent='확인 메일을 보냈어요. 메일의 링크를 누른 뒤 로그인하세요.';}
      }else{
        const {data,error}=await authSignIn(email,pw);
        if(error){msg.textContent=(/confirm/i.test(error.message)?'메일 확인이 아직 안 됐어요. 받은 메일의 링크를 눌러주세요.':'로그인 실패: '+error.message)}
        else if(data&&data.user){CURRENT_UID=data.user.id;CURRENT_EMAIL=data.user.email;await reloadForUser();location.hash='#/home';}
      }
    }catch(e){msg.textContent='오류: '+(e.message||e)}
    asub.disabled=false;
  };
  const lo=document.getElementById('logoutBtn');if(lo)lo.onclick=()=>authSignOut();
  document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{const l=linkBy(b.dataset.copy);if(l)copyText(brandUrl(l))});

  document.querySelectorAll('[data-pcopy]').forEach(b=>b.onclick=()=>copyText(brandProfileUrl()));
  document.querySelectorAll('[data-pubbell]').forEach(b=>b.onclick=()=>modal('준비 중','알림 기능은 다음 버전에서 제공됩니다.'));

  if(path==='/profile'){
    const pen=document.getElementById('penBtn');pen.onclick=()=>{if(S.editing){const n=document.getElementById('pName'),h=document.getElementById('pHandle'),bio=document.getElementById('pBio');if(n){const nn=n.value.trim()||'OOO',hh=(h.value.trim()||'ooo').replace(/^@/,''),bb=bio.value;if(nn!==D.profile.name||hh!==D.profile.handle||bb!==D.profile.bio){D.profile.name=nn;D.profile.handle=hh;D.profile.bio=bb;S.dirty=true}}}S.editing=!S.editing;rerender()};
    document.getElementById('avBtn').onclick=()=>{const f=document.getElementById('blkFile');f.onchange=()=>{if(f.files[0])readFile(f.files[0],d=>{D.profile.avatar=d;f.value='';S.dirty=true;rerender()})};f.click()};
    const sns=document.getElementById('pSns');
    if(sns){
      sns.onclick=()=>modal('준비 중','SNS 연결은 다음 버전에서 제공됩니다.');
      const move=(a,b)=>{if(b<0||b>=D.blocks.length)return;const [m]=D.blocks.splice(a,1);D.blocks.splice(b,0,m);S.dirty=true;rerender()};
      document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{const k=D.blocks[+b.dataset.toggle];k.visible=!k.visible;S.dirty=true;rerender()});
      document.querySelectorAll('[data-img]').forEach(b=>b.onclick=()=>{const f=document.getElementById('blkFile');f.onchange=()=>{if(f.files[0])readFile(f.files[0],d=>{D.blocks[+b.dataset.img].image=d;f.value='';S.dirty=true;rerender();toast('썸네일을 담았어요')})};f.click()});
      let drag=null;

        r.addEventListener('dragstart',e=>{drag=+r.dataset.i;e.dataTransfer.effectAllowed='move'});

        r.addEventListener('dragleave',()=>r.classList.remove('over'));

      });

    const pb=document.getElementById('payoutBtn');if(pb)pb.onclick=()=>modal('정산 요청 접수','말일 이후 광고수익 보고서가 확정되면 실제 금액으로 정산됩니다. 예상액과 다를 수 있어요. (프로토타입: 실제 지급은 이뤄지지 않습니다)');

  }
}

  document.getElementById('pickThumb').innerHTML='미리보기';
  document.getElementById('pickAdd').disabled=true;
  el.querySelectorAll('.item').forEach(it=>it.onclick=()=>{el.querySelectorAll('.item').forEach(x=>x.classList.remove('sel'));it.classList.add('sel');pickSel=it.dataset.slug;document.getElementById('pickAdd').disabled=false;document.getElementById('pickAdd').textContent='프로필에 추가';el.querySelectorAll('.chk').forEach(c=>c.textContent='');it.querySelector('.chk').textContent='✓'});
  document.getElementById('pick').classList.add('show');
}
document.getElementById('pickFile').onchange=e=>{const f=e.target.files[0];if(!f)return;readFile(f,d=>{pickImg=d;document.getElementById('pickThumb').innerHTML=`<img src="${d}" alt="" style="width:100%;height:100%;object-fit:cover">`;e.target.value=''})};
document.getElementById('pickCancel').onclick=()=>document.getElementById('pick').classList.remove('show');
document.getElementById('pick').addEventListener('click',e=>{if(e.target.id==='pick')e.target.classList.remove('show')});
document.getElementById('pickAdd').onclick=()=>{if(!pickSel)return;D.blocks.push({slug:pickSel,visible:true,image:pickImg});S.dirty=true;document.getElementById('pick').classList.remove('show');toast('링크를 담았어요 · 업데이트를 눌러 반영');rerender()};

async function boot(){
  if(USE_DB){
    try{
      const {data:{session}}=await sb.auth.getSession();
      if(session){CURRENT_UID=session.user.id;CURRENT_EMAIL=session.user.email;await dbLoad();}
      sb.auth.onAuthStateChange((_e,sess)=>{const was=CURRENT_UID;CURRENT_UID=sess?sess.user.id:null;CURRENT_EMAIL=sess?sess.user.email:null;if(CURRENT_UID&&CURRENT_UID!==was){reloadForUser();}});
    }catch(e){console.error('Supabase 연결/로그인 초기화 실패:',e)}
  } else { seedMemory(); }
  resetDraft();
  if(!location.hash)location.hash='#/';
  render();
}
window.addEventListener('hashchange',render);
boot();
</script>
